<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboFace - Transmissor de Teclado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090e17;
  --card-bg: rgba(19, 27, 42, 0.85);
  --card-border: #233148;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #8b5cf6;
  --secondary: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --makecode: #0078d4;
  --focus-ring: #f59e0b;
}

/* Modo Alto Contraste Confortável (WCAG) */
body.high-contrast {
  --bg: #000000;
  --card-bg: #000000;
  --card-border: #ffffff;
  --text-main: #ffffff;
  --text-muted: #fef08a;
  --primary: #a78bfa;
  --secondary: #38bdf8;
  --success: #86efac;
  --danger: #fca5a5;
  --focus-ring: #fde047;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.25) 0%, rgba(13, 18, 34, 0.8) 50%, var(--bg) 100%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
}

:focus-visible {
  outline: 3px solid var(--focus-ring) !important;
  outline-offset: 3px !important;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 12px;
}

header {
  text-align: center;
  margin-bottom: 16px;
  position: relative;
}

.header-title-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  margin: 4px 0;
  width: 100%;
}

.title-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 0 auto;
}

.logo-icon {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}

.btn-back {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn-back:hover {
  background: rgba(255, 255, 255, 0.15);
}

.btn-contrast {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.75rem;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.btn-contrast:hover {
  background: rgba(255, 255, 255, 0.05);
}

h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 0;
  color: #fff;
  letter-spacing: -0.02em;
}

.sub {
  color: var(--text-muted);
  font-size: 0.85rem;
  max-width: 600px;
  margin: 4px auto 0;
  line-height: 1.35;
}

.grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 14px;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}

.card-title-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: #f8fafc;
}

.microbit-illustration {
  width: 50px;
  height: 34px;
  opacity: 0.9;
}

.help {
  color: var(--text-muted);
  font-size: 0.8rem;
  line-height: 1.4;
}

label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  color: #a5b4fc;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.btn-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
}

button, .btn-link {
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-decoration: none;
}

button:hover, .btn-link:hover {
  filter: brightness(1.15);
}

.blue { background: var(--secondary); color: #fff; }
.makecode { background: var(--makecode); color: #fff; }

.status {
  padding: 8px 10px;
  border-radius: 10px;
  background: #0b111c;
  border: 1px solid var(--card-border);
  margin: 8px 0;
  font-size: 0.82rem;
}

.ok { color: var(--success); font-weight: 700; }
.bad { color: var(--danger); font-weight: 700; }

.key-display-box {
  background: #0b111c;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  margin: 8px 0;
}

.key-large {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 800;
  color: #38bdf8;
  min-height: 3.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(56, 189, 248, 0.08);
  border-radius: 10px;
  border: 1px dashed rgba(56, 189, 248, 0.3);
  margin-top: 4px;
  padding: 0 10px;
  word-break: break-all;
}

/* Teclado Kaspersky Réplica Exata */
.kaspersky-keyboard {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 12px;
  background: #060b17;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  user-select: none;
}

.v-row {
  display: flex;
  gap: 4px;
  width: 100%;
}

.v-key {
  background: #0d1628;
  border: 1px solid #1c2b47;
  color: #f1f5f9;
  border-radius: 5px;
  padding: 9px 0;
  flex: 1;
  min-width: 0;
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.1s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.v-key:hover {
  background: #1e293b;
  border-color: var(--secondary);
}

.v-key:active, .v-key.active {
  background: var(--primary) !important;
  color: #fff !important;
  border-color: var(--primary) !important;
  transform: scale(0.93);
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
}

/* Proporções exatas da imagem Kaspersky */
.k-back  { flex: 1.5; }
.k-tab   { flex: 1.5; }
.k-caps  { flex: 1.8; }
.k-enter { flex: 2.2; }
.k-shift-l { flex: 2.3; }
.k-shift-r { flex: 1.0; } /* Seta Para Cima fica bem na ponta direita da linha 4 */
.k-ctrl  { flex: 1.4; }
.k-alt   { flex: 1.3; }
.k-space { flex: 6.2; }
.k-arrow { background: #111e36; border-color: #2b3d63; color: #38bdf8; font-weight: 800; }

.log {
  height: 200px;
  overflow-y: auto;
  background: #070a10;
  border-radius: 10px;
  padding: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: #aeb9ca;
  border: 1px solid var(--card-border);
  line-height: 1.5;
}

.big {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.4rem;
  font-weight: 800;
  color: #34d399;
  background: rgba(16, 185, 129, 0.1);
  padding: 6px;
  border-radius: 10px;
  border: 1px dashed rgba(52, 211, 153, 0.3);
  text-align: center;
  margin-top: 4px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media(max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .wrap { padding: 10px 8px; }
  .header-title-container { flex-direction: column; align-items: center; gap: 8px; }
  .btn-back, .btn-contrast { position: static; transform: none; }
  h1 { font-size: 1.25rem; }
  .logo-icon { width: 30px; height: 30px; }
  .card { padding: 12px; margin-bottom: 10px; }
  .v-key { font-size: 0.68rem; padding: 6px 0; }
}
</style>
</head>
<body>
<div class="wrap" role="main">

  <div id="srAnnounce" class="sr-only" aria-live="polite"></div>

  <header>
    <div class="header-title-container">
      <button class="btn-back" id="btnBack" aria-label="Voltar para a página anterior">← Voltar</button>
      <div class="title-box">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="8" y="14" width="48" height="38" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="3"/>
          <rect x="16" y="24" width="8" height="8" rx="2" fill="#38BDF8"/>
          <rect x="28" y="24" width="8" height="8" rx="2" fill="#38BDF8"/>
          <rect x="40" y="24" width="8" height="8" rx="2" fill="#38BDF8"/>
          <rect x="20" y="36" width="24" height="6" rx="2" fill="#34D399"/>
        </svg>
        <h1>RoboFace - Transmissor de Teclado</h1>
      </div>
      <button class="btn-contrast" id="toggleContrast" aria-label="Alternar modo de alto contraste">👁 Altíssimo Contraste</button>
    </div>
    <p class="sub">Pressione qualquer tecla no computador ou clique no teclado virtual para enviar via Bluetooth ao micro:bit.</p>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Última Tecla Pressionada</h2>
        <div class="key-display-box">
          <label>Tecla Detectada</label>
          <div class="key-large" id="keyDisplay">--</div>
        </div>

        <!-- Teclado Virtual Réplica Kaspersky -->
        <div class="kaspersky-keyboard" id="vKeyboard">
          
          <!-- Linha 1 -->
          <div class="v-row">
            <button class="v-key" data-key="'">'</button>
            <button class="v-key" data-key="1">1</button>
            <button class="v-key" data-key="2">2</button>
            <button class="v-key" data-key="3">3</button>
            <button class="v-key" data-key="4">4</button>
            <button class="v-key" data-key="5">5</button>
            <button class="v-key" data-key="6">6</button>
            <button class="v-key" data-key="7">7</button>
            <button class="v-key" data-key="8">8</button>
            <button class="v-key" data-key="9">9</button>
            <button class="v-key" data-key="0">0</button>
            <button class="v-key" data-key="-">-</button>
            <button class="v-key" data-key="=">=</button>
            <button class="v-key k-back" data-key="Backspace">⟵</button>
          </div>

          <!-- Linha 2 -->
          <div class="v-row">
            <button class="v-key k-tab" data-key="Tab">Tab</button>
            <button class="v-key" data-key="q">q</button>
            <button class="v-key" data-key="w">w</button>
            <button class="v-key" data-key="e">e</button>
            <button class="v-key" data-key="r">r</button>
            <button class="v-key" data-key="t">t</button>
            <button class="v-key" data-key="y">y</button>
            <button class="v-key" data-key="u">u</button>
            <button class="v-key" data-key="i">i</button>
            <button class="v-key" data-key="o">o</button>
            <button class="v-key" data-key="p">p</button>
            <button class="v-key" data-key="[">[</button>
            <button class="v-key" data-key="]">]</button>
            <button class="v-key" data-key="\">\</button>
          </div>

          <!-- Linha 3 -->
          <div class="v-row">
            <button class="v-key k-caps" data-key="CapsLock">Caps</button>
            <button class="v-key" data-key="a">a</button>
            <button class="v-key" data-key="s">s</button>
            <button class="v-key" data-key="d">d</button>
            <button class="v-key" data-key="f">f</button>
            <button class="v-key" data-key="g">g</button>
            <button class="v-key" data-key="h">h</button>
            <button class="v-key" data-key="j">j</button>
            <button class="v-key" data-key="k">k</button>
            <button class="v-key" data-key="l">l</button>
            <button class="v-key" data-key=";">;</button>
            <button class="v-key" data-key="'">'</button>
            <button class="v-key k-enter" data-key="Enter">Enter</button>
          </div>

          <!-- Linha 4 (Seta Para Cima alinhada no fim) -->
          <div class="v-row">
            <button class="v-key k-shift-l" data-key="Shift">⇧</button>
            <button class="v-key" data-key="z">z</button>
            <button class="v-key" data-key="x">x</button>
            <button class="v-key" data-key="c">c</button>
            <button class="v-key" data-key="v">v</button>
            <button class="v-key" data-key="b">b</button>
            <button class="v-key" data-key="n">n</button>
            <button class="v-key" data-key="m">m</button>
            <button class="v-key" data-key=",">,</button>
            <button class="v-key" data-key=".">.</button>
            <button class="v-key" data-key="/">/</button>
            <button class="v-key k-shift-r k-arrow" data-key="ArrowUp">↑</button>
          </div>

          <!-- Linha 5 (Setas Esquerda, Baixo e Direita alinhadas perfeitamente abaixo) -->
          <div class="v-row">
            <button class="v-key k-ctrl" data-key="Control">Ctrl</button>
            <button class="v-key k-alt" data-key="Alt">Alt</button>
            <button class="v-key k-space" data-key=" "></button>
            <button class="v-key k-alt" data-key="Alt">Alt</button>
            <button class="v-key k-ctrl" data-key="Control">Ctrl</button>
            <button class="v-key k-arrow" data-key="ArrowLeft">←</button>
            <button class="v-key k-arrow" data-key="ArrowDown">↓</button>
            <button class="v-key k-arrow" data-key="ArrowRight">→</button>
          </div>

        </div>

      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-title-wrap">
          <h2>micro:bit Bluetooth</h2>
          <svg class="microbit-illustration" viewBox="0 0 100 65" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2" y="2" width="96" height="61" rx="8" fill="#111827" stroke="#374151" stroke-width="2"/>
            <circle cx="16" cy="30" r="6" fill="#3B82F6"/>
            <circle cx="84" cy="30" r="6" fill="#3B82F6"/>
            <g fill="#EF4444">
              <circle cx="38" cy="18" r="2"/><circle cx="44" cy="18" r="2"/><circle cx="50" cy="18" r="2"/><circle cx="56" cy="18" r="2"/><circle cx="62" cy="18" r="2"/>
              <circle cx="38" cy="24" r="2"/><circle cx="44" cy="24" r="2"/><circle cx="50" cy="24" r="2"/><circle cx="56" cy="24" r="2"/><circle cx="62" cy="24" r="2"/>
              <circle cx="38" cy="30" r="2"/><circle cx="44" cy="30" r="2"/><circle cx="50" cy="30" r="2"/><circle cx="56" cy="30" r="2"/><circle cx="62" cy="30" r="2"/>
              <circle cx="38" cy="36" r="2"/><circle cx="44" cy="36" r="2"/><circle cx="50" cy="36" r="2"/><circle cx="56" cy="36" r="2"/><circle cx="62" cy="36" r="2"/>
              <circle cx="38" cy="42" r="2"/><circle cx="44" cy="42" r="2"/><circle cx="50" cy="42" r="2"/><circle cx="56" cy="42" r="2"/><circle cx="62" cy="42" r="2"/>
            </g>
            <rect x="8" y="55" width="84" height="8" fill="#F59E0B" rx="1"/>
          </svg>
        </div>

        <div class="btn-group" style="margin-bottom: 8px;">
          <button class="blue" id="btnConnect" style="flex: 1;" aria-label="Conectar ao micro:bit via Bluetooth (Atalho: Alt mais B)">🔵 Conectar micro:bit</button>
          <a class="btn-link makecode" href="https://makecode.microbit.org/S95514-01898-63501-23268" target="_blank" aria-label="Abrir projeto no MakeCode em nova aba">🧩 Código Teste MakeCode ↗</a>
        </div>
        <div id="btStatus" class="status" aria-live="polite">Desconectado</div>
        <label for="lastCommand">Último valor enviado</label>
        <div class="big" id="lastCommand" aria-label="Último valor gerado">--</div>
      </div>

      <div class="card">
        <h2>Histórico de Transmissão</h2>
        <label for="log">Log de Envio</label>
        <div class="log" id="log" role="region" aria-live="polite" tabindex="0"></div>
      </div>
    </div>
  </div>
</div>

<script>
const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let characteristic = null;

const $ = id => document.getElementById(id);

function announceSR(msg){
  $("srAnnounce").textContent = msg;
}

function log(msg){
  $("log").innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + $("log").innerHTML;
}

// Botão Voltar
$("btnBack").onclick = () => {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "index.html";
  }
};

// Toggle Alto Contraste
$("toggleContrast").onclick = () => {
  document.body.classList.toggle("high-contrast");
  announceSR("Modo de alto contraste alterado.");
};

// Formatação do nome legível da tecla
function getFriendlyKeyName(key) {
  if (key === " ") return "Espaço";
  if (key === "ArrowUp") return "Seta Cima (↑)";
  if (key === "ArrowDown") return "Seta Baixo (↓)";
  if (key === "ArrowLeft") return "Seta Esquerda (←)";
  if (key === "ArrowRight") return "Seta Direita (→)";
  return key;
}

// Animação da tecla no teclado virtual
function highlightVirtualKey(key) {
  const targetKey = key.toLowerCase();
  const vKeys = document.querySelectorAll(".v-key");
  
  vKeys.forEach(btn => {
    const attr = (btn.dataset.key || "").toLowerCase();
    if (attr === targetKey || (targetKey === " " && attr === " ")) {
      btn.classList.add("active");
      setTimeout(() => btn.classList.remove("active"), 200);
    }
  });
}

// Envio Bluetooth
async function sendKey(rawKey, displayName){
  if(!rawKey) return;
  
  $("keyDisplay").textContent = displayName;
  $("lastCommand").textContent = rawKey;
  log(`Tecla capturada: "${displayName}" (Código: ${rawKey})`);
  announceSR(`Tecla ${displayName} enviada.`);

  highlightVirtualKey(rawKey);

  if(!characteristic) return;

  try {
    const data = new TextEncoder().encode(rawKey + '\n');
    await characteristic.writeValue(data);
    log(`📤 Enviado ao micro:bit: "${rawKey}"`);
  } catch(e) {
    log("🔴 Erro ao enviar: " + e.message);
  }
}

// Eventos de clique nas teclas virtuais
document.querySelectorAll(".v-key").forEach(btn => {
  const keyVal = btn.dataset.key;
  if(!keyVal) return;
  
  const clickHandler = (e) => {
    e.preventDefault();
    const displayName = getFriendlyKeyName(keyVal);
    sendKey(keyVal, displayName);
  };
  btn.addEventListener("click", clickHandler);
});

// Captura do teclado físico
document.addEventListener("keydown", (e) => {
  if (e.altKey && e.key.toLowerCase() === 'b') {
    $("btnConnect").click();
    return;
  }

  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
    e.preventDefault();
  }

  const displayName = getFriendlyKeyName(e.key);
  sendKey(e.key, displayName);
});

// Conexão Bluetooth
async function connectBluetooth(){
  if(!navigator.bluetooth){ alert("Use Chrome ou Edge com suporte a Web Bluetooth."); return; }
  try {
    $("btStatus").textContent = "🔵 Procurando micro:bit...";
    announceSR("Procurando micro:bit.");
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [
        "00001800-0000-1000-8000-00805f9b34fb",
        "00001801-0000-1000-8000-00805f9b34fb",
        "0000180a-0000-1000-8000-00805f9b34fb",
        UART_SERVICE
      ]
    });

    device.addEventListener("gattserverdisconnected", () => {
      characteristic = null;
      $("btStatus").innerHTML = '<span class="bad">Desconectado</span>';
      announceSR("micro:bit desconectado.");
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    const txChar = await service.getCharacteristic(UART_TX);
    await txChar.startNotifications();
    characteristic = await service.getCharacteristic(UART_RX);

    $("btStatus").innerHTML = '<span class="ok">● Conectado: ' + (device.name || "micro:bit") + '</span>';
    log("Bluetooth conectado com sucesso.");
    announceSR("micro:bit conectado.");
  } catch(e) {
    characteristic = null;
    $("btStatus").innerHTML = '<span class="bad">Erro ao conectar</span>';
    log("Bluetooth: " + e.message);
  }
}

$("btnConnect").onclick = connectBluetooth;
</script>
</body>
</html>
