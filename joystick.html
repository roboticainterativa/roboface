<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ROBOFACE • JOYSTICK ANALÓGICO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020305;
  --card-bg: #0d121c;
  --card-border: #1a2333;
  --text-main: #f8fafc;
  --text-muted: #64748b;
  --primary: #8b5cf6;
  --secondary: #2563eb;
  --danger: #ef4444;

  --btn-y: #eab308;
  --btn-x: #2563eb;
  --btn-b: #dc2626;
  --btn-a: #16a34a;
}

body.high-contrast {
  --bg: #000000;
  --card-bg: #000000;
  --card-border: #ffffff;
  --text-main: #ffffff;
  --text-muted: #fef08a;
}

* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at 50% 30%, #111522 0%, #030407 80%, var(--bg) 100%), var(--bg);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}

.wrap {
  width: 100vw;
  max-width: 960px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-title {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 0.05em;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-top {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--card-border);
  color: var(--text-main);
  padding: 7px 16px;
  border-radius: 8px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-top:active { transform: scale(0.95); }

.roboface-icon {
  width: 28px;
  height: 28px;
}

/* =========================================================
   CARCAÇA MEGA DRIVE
   ========================================================= */
.megadrive-shell {
  background: 
    radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.15) 0%, transparent 60%),
    radial-gradient(circle at 10% 50%, #222530 0%, #12131a 55%, #050608 100%),
    radial-gradient(circle at 90% 50%, #222530 0%, #12131a 55%, #050608 100%),
    linear-gradient(180deg, #1a1c24 0%, #08090c 100%);
  border: 5px solid #282b38;
  border-radius: 100px 100px 80px 80px;
  padding: 32px 48px 24px;
  box-shadow: 
    0 30px 70px rgba(0,0,0,0.98), 
    inset 0 3px 5px rgba(255,255,255,0.22),
    inset 0 -12px 24px rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  position: relative;
}

/* Botão Bluetooth Embutido no Topo */
.btn-bluetooth-top {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
  border: 2px solid #60a5fa;
  color: #fff;
  padding: 6px 22px;
  border-radius: 18px;
  font-size: 0.85rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
  z-index: 10;
}

.btn-bluetooth-top:active { transform: translateX(-50%) scale(0.95); }

/* Módulo Analógico Côncavo */
.joy-base {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, #080a0f 0%, #171a26 75%, #050609 100%);
  border: 5px solid #282c3c;
  box-shadow: inset 0 8px 18px rgba(0,0,0,0.95), 0 3px 6px rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  touch-action: none;
}

.joy-stick {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #3a3f52 0%, #13151f 80%);
  border: 3px solid #4a4f66;
  box-shadow: 0 8px 16px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.3);
  position: absolute;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.05s ease-out;
}

.joy-stick::after {
  content: '';
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: radial-gradient(circle, #10121a 0%, #202433 100%);
  border: 1px solid #383d52;
}

/* Painel Central */
.center-cockpit {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin-top: 22px;
}

.debug-screen {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: #38bdf8;
  background: #020305;
  border: 1px solid #1c2333;
  padding: 6px 16px;
  border-radius: 8px;
  text-align: center;
  min-width: 150px;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.95);
}

.oval-row {
  display: flex;
  gap: 14px;
}

.oval-btn {
  background: linear-gradient(180deg, #282b38 0%, #13151c 100%);
  border: 1.5px solid #3b3f52;
  color: #fff;
  padding: 10px 22px;
  border-radius: 22px;
  font-size: 0.8rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 10px rgba(0,0,0,0.7);
}

.oval-btn:active, .oval-btn.active {
  background: var(--secondary);
}

.btn-stop-center {
  background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
  border: 1.5px solid #fca5a5;
  color: #fff;
  padding: 8px 34px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5);
}

.btn-stop-center:active, .btn-stop-center.active {
  transform: scale(0.94);
  filter: brightness(1.2);
}

/* ABXY */
.abxy-container {
  width: 180px;
  height: 180px;
  position: relative;
}

.act-btn {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.45);
  color: #fff;
  font-size: 1.45rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,0.85), inset 0 2px 5px rgba(255,255,255,0.5);
}

.act-btn:active, .act-btn.active {
  transform: scale(0.92);
  filter: brightness(1.25);
}

.act-y { top: 0; left: 60px; background: var(--btn-y); border-color: #fde047; text-shadow: 0 2px 4px #000; }
.act-a { bottom: 0; left: 60px; background: var(--btn-a); border-color: #86efac; text-shadow: 0 2px 4px #000; }
.act-x { top: 60px; left: 0; background: var(--btn-x); border-color: #7dd3fc; text-shadow: 0 2px 4px #000; }
.act-b { top: 60px; right: 0; background: var(--btn-b); border-color: #fca5a5; text-shadow: 0 2px 4px #000; }

/* Sliders */
.sliders-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  width: 100%;
}

.slider-card {
  background: #090c14;
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.slider-card label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}

.slider-card input[type="range"] {
  width: 100%;
  height: 6px;
  accent-color: var(--secondary);
}

@media (max-width: 768px) {
  .megadrive-shell { padding: 24px 20px 18px; border-radius: 60px; }
  .joy-base, .abxy-container { transform: scale(0.82); }
  .center-cockpit { transform: scale(0.9); margin-top: 10px; }
  .sliders-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div id="srAnnounce" class="sr-only" aria-live="polite"></div>

<div class="wrap" role="main">

  <header>
    <div class="brand-title">
      <button class="btn-top" id="btnBack">← Voltar</button>
      <svg class="roboface-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="14" width="48" height="38" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="3"/>
        <rect x="16" y="24" width="8" height="8" rx="2" fill="#38BDF8"/>
        <rect x="28" y="24" width="8" height="8" rx="2" fill="#38BDF8"/>
        <rect x="40" y="24" width="8" height="8" rx="2" fill="#38BDF8"/>
        <rect x="20" y="36" width="24" height="6" rx="2" fill="#34D399"/>
      </svg>

      ROBOFACE • JOYSTICK
    </div>
    <div style="display: flex; gap: 8px;">
      <!-- Link do projeto MakeCode atualizado -->
      <a class="btn-top" href="https://makecode.microbit.org/S22681-96784-80257-30627" target="_blank">🧩 MakeCode ↗</a>
      <button class="btn-top" id="toggleContrast">👁 Alto Contraste</button>
    </div>
  </header>

  <!-- CONTROLE COM JOYSTICK ANALÓGICO -->
  <div class="megadrive-shell">
    <button class="btn-bluetooth-top" id="btnConnect">🔵 Bluetooth</button>

    <!-- Módulo Analógico Touch -->
    <div class="joy-base" id="joyBase">
      <div class="joy-stick" id="joyStick"></div>
    </div>

    <!-- Painel Central -->
    <div class="center-cockpit">
      <div class="debug-screen" id="debugStatus">Pronto</div>
      
      <div class="oval-row">
        <button class="oval-btn g-btn" data-key="SELECT" aria-label="Select">SELECT</button>
        <button class="oval-btn g-btn" data-key="Enter" aria-label="Start">START</button>
      </div>
      <button class="btn-stop-center g-btn" data-key="STOP">🛑 STOP</button>
    </div>

    <!-- Conjunto ABXY -->
    <div class="abxy-container">
      <button class="act-btn act-y g-btn" data-key="y">Y</button>
      <button class="act-btn act-x g-btn" data-key="x">X</button>
      <button class="act-btn act-b g-btn" data-key="b">B</button>
      <button class="act-btn act-a g-btn" data-key="a">A</button>
    </div>
  </div>

  <!-- Sliders de Ajuste -->
  <div class="sliders-grid">
    <div class="slider-card">
      <label>Velocidade máxima <span id="v1">45</span></label>
      <input type="range" id="s1" min="0" max="100" value="45" oninput="updateSlider('vel', this.value, 'v1')">
    </div>
    <div class="slider-card">
      <label>Aceleração <span id="v2">29</span></label>
      <input type="range" id="s2" min="0" max="100" value="29" oninput="updateSlider('ace', this.value, 'v2')">
    </div>
    <div class="slider-card">
      <label>Raio de curva <span id="v3">-12</span></label>
      <input type="range" id="s3" min="-100" max="100" value="-12" oninput="updateSlider('rai', this.value, 'v3')">
    </div>
    <div class="slider-card">
      <label>Checagem <span id="v4">3</span></label>
      <input type="range" id="s4" min="0" max="100" value="3" oninput="updateSlider('che', this.value, 'v4')">
    </div>
  </div>

</div>

<script>
const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let rxCharacteristic = null;
const $ = id => document.getElementById(id);

function updateStatus(msg) {
  $("debugStatus").textContent = msg;
}

$("btnBack").onclick = () => {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = "index.html";
  }
};

$("toggleContrast").onclick = () => {
  document.body.classList.toggle("high-contrast");
};

function highlightButton(key) {
  document.querySelectorAll(".g-btn").forEach(btn => {
    const attr = btn.dataset.key;
    if (attr === key || attr.toLowerCase() === key.toLowerCase()) {
      btn.classList.add("active");
      setTimeout(() => btn.classList.remove("active"), 150);
    }
  });
}

// Transmissão via Web Bluetooth
async function sendCommand(rawKey) {
  if (rawKey === undefined || rawKey === null) return;
  
  highlightButton(rawKey);
  updateStatus("Enviado: " + rawKey);

  if (!rxCharacteristic) {
    console.warn("Bluetooth não conectado. Comando:", rawKey);
    return;
  }

  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(rawKey + "\n");
    
    if (rxCharacteristic.writeValueWithoutResponse) {
      await rxCharacteristic.writeValueWithoutResponse(data);
    } else {
      await rxCharacteristic.writeValue(data);
    }
  } catch (e) {
    console.error("Erro no envio:", e);
    updateStatus("Erro Envio!");
  }
}

function updateSlider(prefix, value, displayId) {
  $(displayId).textContent = value;
  const msg = `${prefix}:${value}`;
  sendCommand(msg);
}

// LÓGICA DO JOYSTICK ANALÓGICO 360°
const joyBase = $("joyBase");
const joyStick = $("joyStick");
let isDragging = false;
let lastJoySend = 0;

function handleJoyMove(clientX, clientY) {
  const rect = joyBase.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const maxRadius = rect.width / 2 - 20;

  let deltaX = clientX - centerX;
  let deltaY = clientY - centerY;
  let distance = Math.hypot(deltaX, deltaY);

  if (distance > maxRadius) {
    deltaX = (deltaX / distance) * maxRadius;
    deltaY = (deltaY / distance) * maxRadius;
  }

  joyStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

  // Mapear coordenadas para escala de -100 a 100
  const normX = Math.round((deltaX / maxRadius) * 100);
  const normY = Math.round((-deltaY / maxRadius) * 100); // Y invertido para cima ser positivo

  // Limitar taxa de envio para não sobrecarregar a fila Bluetooth (a cada 80ms)
  const now = Date.now();
  if (now - lastJoySend > 80) {
    sendCommand(`joy:${normX},${normY}`);
    lastJoySend = now;
  }
}

function resetJoy() {
  isDragging = false;
  joyStick.style.transform = `translate(0px, 0px)`;
  sendCommand("CENTER");
}

joyBase.addEventListener("pointerdown", (e) => {
  isDragging = true;
  joyBase.setPointerCapture(e.pointerId);
  handleJoyMove(e.clientX, e.clientY);
});

joyBase.addEventListener("pointermove", (e) => {
  if (isDragging) handleJoyMove(e.clientX, e.clientY);
});

joyBase.addEventListener("pointerup", resetJoy);
joyBase.addEventListener("pointercancel", resetJoy);

// Eventos de clique para botões
document.querySelectorAll(".g-btn").forEach(btn => {
  const keyVal = btn.dataset.key;
  if (keyVal === undefined) return;

  const handlePress = (e) => {
    e.preventDefault();
    sendCommand(keyVal);
  };

  btn.addEventListener("touchstart", handlePress, { passive: false });
  btn.addEventListener("mousedown", handlePress);
});

// Suporte a teclado físico
document.addEventListener("keydown", (e) => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
    e.preventDefault();
  }
  
  if (e.code === "Space" || e.key === " ") {
    sendCommand("SELECT");
  } else {
    sendCommand(e.key);
  }
});

// Conexão Web Bluetooth
async function connectBluetooth() {
  if (!navigator.bluetooth) {
    alert("O seu navegador não suporta Web Bluetooth. Use o Google Chrome ou Microsoft Edge.");
    return;
  }

  try {
    updateStatus("Conectando...");
    $("btnConnect").textContent = "🔵 Conectando...";

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE]
    });

    device.addEventListener("gattserverdisconnected", () => {
      rxCharacteristic = null;
      $("btnConnect").textContent = "🔵 Bluetooth";
      updateStatus("Desconectado");
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    rxCharacteristic = await service.getCharacteristic(UART_RX);

    $("btnConnect").textContent = "● Conectado!";
    updateStatus("Conectado ✔");
  } catch (e) {
    rxCharacteristic = null;
    $("btnConnect").textContent = "🔵 Bluetooth";
    updateStatus("Erro Conexão");
  }
}

$("btnConnect").onclick = connectBluetooth;
</script>
</body>
</html>
